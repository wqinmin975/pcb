[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solderbench"
version = "0.1.1"
description = "An open-source synthetic benchmark for PCB solder-joint defect inspection algorithm development"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Qinmin Wang", email = "wangqinmin@gdust.edu.cn" },
    { name = "Zixin Wang", email = "396514839@qq.com" },
    { name = "Hongyuan Wang" },
    { name = "Zongzhong Wang", email = "wangzz@gdut.edu.cn" },
]
keywords = ["PCB", "solder joint", "defect inspection", "point cloud",
            "benchmark", "machine learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "matplotlib>=3.4",
]

[project.urls]
Homepage = "https://github.com/wqinmin975/pcb"
Repository = "https://github.com/wqinmin975/pcb"

[tool.setuptools.packages.find]
include = ["solderbench*"]
